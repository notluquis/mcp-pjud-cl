version: 2

# Sin `cooldown`, a propósito. El enfriamiento retrasaba cada actualización unos días para que
# la comunidad alcanzara a detectar una versión comprometida antes de que entrara acá, que es la
# ventana de los ataques de cadena de suministro. Se quitó para enterarse el mismo día que sale
# una versión, sobre todo del SDK de MCP, cuya última ruptura pasó siete días sin que nada
# avisara. Se acepta esa ventana a cambio de la alerta inmediata: el PR de Dependabot no se
# auto-mergea, pasa por CI y por revisión, así que una versión mala no entra sola.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    # `daily`, no `weekly`: sin cooldown el objetivo es enterarse el mismo día que sale una
    # versión, y un chequeo semanal (sólo lunes) la retrasaría hasta seis días, que es
    # justo lo que se quitó el cooldown para no hacer.
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # pytest y mutmut juntos: pytest 9.2 quitó `Node._nodeid` y rompió mutmut 3.8.0. Solo, el
    # PR de pytest pasaba CI y la mutación se caía después, tapada por el `|| true` del job.
    groups:
      pruebas:
        patterns: ["pytest", "mutmut"]
    commit-message:
      prefix: "chore"
    labels: ["dependencias"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # init, analyze y upload-sarif tienen que ir en la misma versión: si Dependabot sube uno
    # solo, CodeQL falla con "Loaded a configuration file for version X, but running version Y".
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
    commit-message:
      prefix: "chore"
    labels: ["dependencias"]
