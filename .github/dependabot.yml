version: 2

# Sin `cooldown`, a propósito. El enfriamiento retrasaba cada actualización unos días para que
# la comunidad alcanzara a detectar una versión comprometida antes de que entrara acá, que es la
# ventana de los ataques de cadena de suministro. Se quitó para enterarse el mismo día que sale
# una versión, sobre todo del SDK de MCP, cuya última ruptura pasó siete días sin que nada
# avisara. Se acepta esa ventana a cambio de la alerta inmediata: el PR de Dependabot no se
# auto-mergea, pasa por CI y por revisión, así que una versión mala no entra sola.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels: ["dependencias"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels: ["dependencias"]
