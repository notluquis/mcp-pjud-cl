name: codeql

# Configuración avanzada, en reemplazo del modo gestionado por GitHub.
#
# Qué gana sobre el modo gestionado, dicho con precisión: la acción queda fijada por SHA
# como el resto de los workflows, y la configuración vive en el repositorio en vez de en un
# panel. `security-extended` NO es parte de la ganancia: el modo gestionado también lo
# ofrece desde Settings.
#
# Qué cuesta: las dos configuraciones no pueden coexistir. Mientras exista este archivo, el
# modo gestionado tiene que estar deshabilitado en Settings, y eso es estado fuera del
# control de versiones que nada acá puede verificar. Si alguien lo reactiva, este workflow
# falla con "CodeQL analyses from advanced configurations cannot be processed when the
# default setup is enabled", y como es check obligatorio en main, bloquea todo merge hasta
# que alguien toque ese panel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 2"

permissions: {}

# Sin `cancel-in-progress`. El único producto de este workflow es la subida del SARIF, así
# que una corrida cancelada deja ese commit sin resultados de escaneo. La plantilla oficial
# de CodeQL tampoco define grupo de concurrencia, por lo mismo.

jobs:
  analizar:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      # Necesario para descargar los paquetes de consultas de CodeQL.
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `build-mode: none` porque ninguno de los dos requiere compilación. Sin esto,
          # CodeQL intentaría autobuild y perdería tiempo en un paso que no aplica.
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # security-extended agrega consultas de precisión y severidad menores sobre las de
      # `default`. Cubre más a costa de más falsos positivos, intercambio razonable en un
      # proyecto chico donde revisar un hallazgo dudoso cuesta poco.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
