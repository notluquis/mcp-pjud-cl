name: publicar

# Se dispara al empujar una etiqueta v*. Crea la versión en GitHub con notas generadas
# automáticamente y adjunta el inventario de dependencias.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # `block` y no `audit`: este job corre la suite, así que le vale la misma garantía que
      # a `tests.yml`. Sin esto, una prueba que abriera un cliente real quedaría detenida en
      # aquel workflow y saldría por éste. Ningún dominio de `pjud.cl` está en la lista.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            astral.sh:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caché desactivada a propósito, y de forma explícita porque el valor por defecto
      # la activa en runners de GitHub. En un flujo que publica artefactos, una caché
      # envenenada puede terminar dentro de lo publicado.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # No se publica una versión que no pasa sus propias pruebas.
      - run: uv sync --group dev
      - run: uv run pytest -q

      - run: uv build

      # El inventario sale de la API de GitHub, que ya lo genera desde el grafo de
      # dependencias. Evita agregar una acción de terceros para algo que ya existe.
      - name: Inventario de dependencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" > sbom.spdx.json

      # Las notas se arman acá en vez de con `--generate-notes` porque esa plantilla es
      # fija y viene en inglés: imprime "What's Changed" y "by X in Y" sobre un proyecto
      # cuyo idioma es el español de Chile, incluida la documentación publicada.
      #
      # Se conserva la intención de `.github/release.yml`, que sigue categorizando: el
      # tramo del CHANGELOG dice POR QUÉ importa el cambio y la lista generada dice QUÉ
      # cambió, con sus enlaces. Lo único que se hace es ponerlas en ese orden y traducir
      # los dos encabezados que GitHub no deja configurar.
      - name: Armar las notas de la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # `index($0, v) == 1` y no una expresión regular: los corchetes de "## [0.2.0]"
          # se leerían como una clase de caracteres y el tramo saldría vacío.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { encontrado = 1; next }
            encontrado && /^## \[/ { exit }
            encontrado { print }
          ' CHANGELOG.md > notas.md

          # Sin esto, un CHANGELOG sin la sección de esta versión publicaría una release
          # con el cuerpo vacío y nadie se enteraría hasta leerla.
          if [ ! -s notas.md ]; then
            echo "CHANGELOG.md no tiene una sección '## [$VERSION]'." >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generadas.md

          {
            echo
            echo "## Qué cambió"
            sed -e "/^## What's Changed$/d" \
                -e "s/^\*\*Full Changelog\*\*/**Comparación completa**/" generadas.md
          } >> notas.md

      # `gh release` viene en el runner. Una acción de terceros para esto sería
      # superficie de cadena de suministro sin ganancia.
      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notas.md \
            dist/* sbom.spdx.json

      # `stable` es lo que la documentación recomienda instalar: apunta siempre a la última
      # versión publicada. Sin ella, la instalación por defecto seguía la rama principal, o sea
      # la gente corría código sin publicar y sin saberlo.
      #
      # Va DESPUÉS de crear la versión a propósito: si la publicación falla, `stable` no se
      # mueve y quien instale sigue en la anterior, que es la que funciona.
      #
      # Se mueve por la API y no con `git push` porque el checkout no conserva credenciales. Y
      # sin `force`: mover `stable` es siempre un avance, así que si alguna vez no lo fuera,
      # esto tiene que fallar ruidoso en vez de retroceder a la gente en silencio.
      - name: Mover `stable` a esta versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" \
              -f sha="$GITHUB_SHA" \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/stable" -f sha="$GITHUB_SHA"
