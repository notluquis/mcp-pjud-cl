name: scorecard

# OpenSSF Scorecard mide la postura de seguridad del repositorio: si las acciones están
# fijadas por SHA, si hay análisis estático, si los permisos son mínimos, si el proyecto
# está mantenido. Publica el resultado en code scanning.

on:
  branch_protection_rule:
  schedule:
    - cron: "15 4 * * 6"
  push:
    branches: [main]

permissions: {}

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
