name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 12:00 UTC. No consulta al Poder Judicial: sólo detecta que una dependencia
    # nueva rompa el parser sobre las fixtures guardadas.
    - cron: "0 12 * * 1"

# Sin permisos por defecto. Cada job pide sólo lo que necesita.
permissions: {}

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Bloquea todo el tráfico saliente salvo lo declarado. Para este proyecto no es sólo
      # higiene: la promesa es que CI nunca consulta al Poder Judicial, y con `block` deja
      # de ser una promesa auditable para pasar a ser una imposibilidad. Ningún dominio de
      # `pjud.cl` está en la lista, así que una petición desde CI no sale.
      #
      # Cada entrada corresponde a un paso concreto de este job:
      #   github.com, api.github.com, codeload.github.com  -> checkout y las acciones
      #   objects.githubusercontent.com, release-assets.githubusercontent.com
      #                                                    -> binarios de las acciones
      #   raw.githubusercontent.com                        -> manifiesto de versiones de uv
      #   astral.sh                                        -> binario de uv
      #   pypi.org, files.pythonhosted.org                 -> uv sync
      #
      # Si esto pone CI en rojo con un destino no declarado, la respuesta correcta es
      # mirar cuál es y decidir si corresponde agregarlo, no volver a `audit`. Un fallo
      # ruidoso acá vale exactamente lo mismo que en el parser.
      - name: Bloquear tráfico saliente no declarado
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            astral.sh:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El job no hace push. Sin esto, el token queda escrito en .git/config y
          # cualquier paso posterior podría usarlo.
          persist-credentials: false
          # Historia completa. Un guardia compara los anclajes que la hoja de ruta publicó
          # antes de partirla contra los que conserva hoy, y para eso lee el archivo en un
          # commit anterior. Con el clon superficial ese guardia se SALTABA, o sea no corría
          # justo donde importa: verde en CI y roto en lo publicado.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # Los tests corren contra HTML real guardado en tests/fixtures/. Ninguno consulta
      # al Poder Judicial: CI nunca genera tráfico a la plataforma.
      - name: Tests
        run: uv run pytest -v

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      # Encontró que tres de las cuatro búsquedas declaraban aceptar `paginas=None` y
      # reventaban con TypeError, porque sólo la búsqueda por rol implementaba esa rama.
      - name: Tipos
        run: uv run ty check

      - name: Documentación
        # `-W` convierte los avisos en errores, y sin eso una reorganización rota pasa: se
        # midió sacando una página del `toctree` y dejando dos referencias muertas, y el
        # comando salía en 0 con tres avisos que nadie iba a leer en el registro de CI.
        # El árbol actual ya pasa con `-W`, así que se enciende sin deuda previa.
        run: uv run sphinx-build -W -b html docs docs/_build/html

  workflows:
    name: Analizar los propios workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Busca inyección de plantillas, acciones sin fijar, disparadores peligrosos y
      # permisos excesivos en los workflows de este mismo repositorio.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  sin-escritura:
    name: Verificar que no exista código de escritura
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La garantía central del proyecto es que no puede escribir en los sistemas del
      # Poder Judicial. Esto lo verifica en cada cambio, en vez de confiar en la revisión.
      # Los cuatro primeros son de la Oficina Judicial Virtual. Los tres últimos son del
      # buscador de fallos: guardar sentencias y cambiar la clave escriben en una cuenta, y
      # compartir por correo manda correo desde la infraestructura del Poder Judicial. Que
      # sean de lectura de jurisprudencia no los vuelve inofensivos.
      - name: Buscar endpoints de escritura
        run: |
          if grep -rniE 'ingresoCausas|ingresoEscrito|subirEscrito|presentarEscrito|mail_compartir_sentencia|sentencias_guardadas|cambiar_clave' \
               --include='*.py' src/ tests/; then
            echo "::error::Se encontró una referencia a endpoints de escritura del PJUD."
            exit 1
          fi
          echo "Sin referencias a endpoints de escritura."

      # Las dos constantes definen juntas el ritmo: el intervalo fija el régimen sostenido
      # y la ráfaga cuántas pueden salir juntas antes de que ese régimen mande. Subir la
      # segunda sin tocar la primera vacía la garantía sin cambiar el número que todos miran.
      - name: Verificar que el ritmo de las consultas no se relajó
        run: |
          grep -q 'INTERVALO_MINIMO = 5.0' src/mcp_pjud/client.py || {
            echo "::error::El intervalo mínimo entre peticiones cambió. Es la cláusula CUARTA."
            exit 1
          }
          grep -q 'RAFAGA_MAXIMA = 4' src/mcp_pjud/client.py || {
            echo "::error::La ráfaga máxima cambió. Con el intervalo, define el ritmo total."
            exit 1
          }
          echo "Ritmo intacto: intervalo de 5 s y ráfaga de 4."

      # La anonimización de las fixtures la cubre tests/test_fixtures.py, en el job de
      # arriba. Se hizo en Python y no en grep a propósito: la primera versión usaba una
      # retro-referencia que el grep local no soporta, el comando erraba, y la salida
      # vacía se leía como "sin hallazgos". Un guardia que no puede fallar imprime lo
      # mismo que uno que protege.
