version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

# Se instala el propio paquete con su extra `docs`, en vez de un requirements.txt aparte.
# Una lista duplicada se desincroniza: ya pasó una vez y rompió el build.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
