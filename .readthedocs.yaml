version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

# `method: uv` lee el grupo `docs` del pyproject y respeta uv.lock, así que instala las
# mismas versiones que CI. Con pip y un extra, los nombres coincidían pero las versiones se
# resolvían de nuevo contra PyPI: una publicación incompatible rompía sólo acá, con CI en
# verde. Es la misma forma de falla que ya ocurrió con el requirements.txt duplicado.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
