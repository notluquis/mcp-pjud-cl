[project]
name = "mcp-pjud"
version = "0.19.1"
description = "Servidor MCP no oficial de solo lectura para la consulta pública de causas del Poder Judicial de Chile."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Lucas Pulgar Escobar" }]
keywords = ["mcp", "chile", "judicial", "legaltech", "plazos", "receptor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    # El SDK corre las herramientas síncronas en un hilo, y el aviso de progreso hay que
    # devolverlo al bucle de eventos con `anyio.from_thread.run`. Hoy entra de prestado por
    # `mcp` y por eso se declara: apoyarse en una dependencia transitiva es depender de una
    # decisión ajena, y si esa cadena cambia el servidor muere al importar.
    "anyio>=4.0",
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic>=2.10",
    # Sólo para saber si un PDF trae capa de texto y cuántas páginas tiene. La licencia
    # decide y no la velocidad: PyMuPDF es entre 8 y 12 veces más rápida y va bajo AGPL-3.0,
    # que enlazada desde una rueda distribuida bajo PolyForm Strict pone las dos licencias en
    # conflicto. `pypdf` es BSD-3 y Python puro, o sea tampoco arrastra binarios.
    #
    # No se usa para OCR, y no porque falte: una transcripción automática de una resolución
    # se ve idéntica a la resolución y no lo es.
    "pypdf>=6.0",
]

[project.urls]
Repositorio = "https://github.com/notluquis/mcp-pjud-cl"
"Documentación" = "https://mcp-pjud-cl.readthedocs.io"
Incidencias = "https://github.com/notluquis/mcp-pjud-cl/issues"
Cambios = "https://github.com/notluquis/mcp-pjud-cl/blob/main/CHANGELOG.md"
"Uso aceptable" = "https://github.com/notluquis/mcp-pjud-cl/blob/main/ACCEPTABLE_USE.md"

[project.scripts]
mcp-pjud = "mcp_pjud.server:main"

[dependency-groups]
# `docs` es un grupo y no un extra a propósito. Un extra se publica en los metadatos del
# paquete, y quien instale mcp-pjud vería un `[docs]` que arrastra un tema de Sphinx. Read
# the Docs lee grupos de forma nativa con `method: uv`, que además respeta uv.lock, así que
# instala exactamente las mismas versiones que CI. Un requirements.txt aparte no lograba
# ninguna de las dos cosas.
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "furo>=2024.8",
    "sphinx-llm>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mutmut>=3.2",
    "zizmor>=1.29",
    "hypothesis>=6.165.10",
    "ty>=0.0.72",
    "lxml-stubs>=0.5.1",
    # `tests/test_protocolo.py` valida el contenido estructurado contra el esquema que el
    # servidor anuncia. Funciona sin declararlo, porque `mcp` lo arrastra, y por eso mismo se
    # declara: apoyarse en una dependencia transitiva es depender de una decisión ajena que
    # puede cambiar sin aviso, y el test moriría con un ImportError que no dice nada.
    "jsonschema>=4.20",
    # Mismo caso, y por la misma razón: un guardia lee los workflows para exigir que los
    # trabajos que corren la suite clonen la historia completa. Hoy funciona sin declararlo
    # porque `mutmut` arrastra `libcst`, que arrastra `pyyaml`. Si esa cadena cambia, la suite
    # entera muere al recolectar, y con ella la publicación que ese guardia protege.
    "pyyaml>=6.0",
    "cogapp>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pjud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# El harness de fuzzing no es un test: requiere atheris y se corre a mano.
addopts = "--ignore=tests/fuzz_parser.py"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# `S` (bandit) porque el proyecto declara una postura de seguridad y conviene que la
# revise una herramienta, no sólo la revisión humana. `DTZ` porque acá las fechas deciden
# plazos procesales y una fecha sin zona horaria es justo el error que no se puede cometer.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "DTZ", "RUF", "PT", "C4", "PTH"]

[[tool.ty.overrides]]
# `lxml-stubs` tipa el retorno de `.xpath()` como la unión de todo lo que XPath puede
# devolver (float, str, bytes, lista de nodos). Es fiel a la especificación e inútil acá:
# todas nuestras consultas devuelven nodos. Se acotan estas reglas en el parser en vez de
# renunciar a los stubs, que sí tipan bien el resto de lxml.
include = ["src/mcp_pjud/parser.py", "tests/test_parser.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"

[tool.ty.src]
# Mismo motivo que en pytest y en ruff: el harness de fuzzing importa atheris, que se
# instala a demanda y no es dependencia del proyecto.
exclude = ["tests/fuzz_parser.py"]

[tool.mutmut]
# Se muta el parser y el cliente: ahí vive la lógica que puede costar un plazo.
# Los nombres viejos (`paths_to_mutate` y `tests_dir`) siguen funcionando y avisan en cada
# corrida; mutmut 3 los renombró.
source_paths = ["src/mcp_pjud/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.ruff.lint.per-file-ignores]
# El harness de fuzzing importa atheris, que se instala a demanda y no es dependencia.
"tests/fuzz_parser.py" = ["E402"]
# S101 es `assert`, que en pytest es la forma de escribir un test. S106 marca literales que
# parecen contraseñas: acá son tokens de mentira para los dobles, y las fixtures ya se
# revisan aparte en `test_fixtures.py`.
# S607 marca invocar un ejecutable por nombre y no por ruta absoluta. Acá se llama a `git`,
# que viene del PATH igual que en CI, y fijar una ruta absoluta lo haría menos portable.
"tests/*" = ["S101", "S106", "S607"]
