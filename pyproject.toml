[project]
name = "mcp-pjud"
version = "0.1.0"
description = "Servidor MCP no oficial de solo lectura para la consulta pública de causas del Poder Judicial de Chile."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Lucas Pulgar Escobar" }]
keywords = ["mcp", "chile", "judicial", "legaltech", "plazos", "receptor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic>=2.10",
]

[project.urls]
Repositorio = "https://github.com/notluquis/mcp-pjud-cl"
"Documentación" = "https://mcp-pjud-cl.readthedocs.io"
Incidencias = "https://github.com/notluquis/mcp-pjud-cl/issues"
Cambios = "https://github.com/notluquis/mcp-pjud-cl/blob/main/CHANGELOG.md"
"Uso aceptable" = "https://github.com/notluquis/mcp-pjud-cl/blob/main/ACCEPTABLE_USE.md"

[project.scripts]
mcp-pjud = "mcp_pjud.server:main"

# Las dependencias de documentación van como extra y no como grupo, para que Read the Docs,
# que instala con pip, y uv usen exactamente la misma lista. Tenerlas en dos archivos ya
# rompió un build: se agregó una extensión al grupo y el requirements.txt quedó atrás.
[project.optional-dependencies]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "furo>=2024.8",
    "sphinx-llm>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mutmut>=3.2",
    "zizmor>=1.29",
    "hypothesis>=6.165.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pjud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mutmut]
# Se muta el parser y el cliente: ahí vive la lógica que puede costar un plazo.
paths_to_mutate = ["src/mcp_pjud/"]
tests_dir = ["tests/"]
